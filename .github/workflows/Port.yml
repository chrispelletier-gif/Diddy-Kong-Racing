name: 3DS port

# Builds the native port (port/) on every push: dkr.3dsx for the 3DS and the headless host build, then plays the
# host build through the scripted scenarios in port/tools/frame_regression.py and compares its frames with the
# build of the previous commit.
#
# Needs the ROMURL repository secret (the same one the N64 workflows use): a private download URL for a US 1.0
# ROM (sha1 0cb115d8716dbbc2922fda38e533b9fe63bb9670). The ROM is only used inside the jobs; it is never uploaded.
#
# Pushing a version tag (vX.Y.Z, or vX.Y.Z-label such as v0.1.0-beta) builds that commit and makes a draft GitHub
# Release of it with the player's dkr.3dsx and dkr.cia (job release-3ds). Nothing is public until the draft is
# published on GitHub. The builds take their version from the newest such tag (port/Makefile).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-${{ github.ref }}
  cancel-in-progress: true

env:
  ROM_SHA1: 0cb115d8716dbbc2922fda38e533b9fe63bb9670

jobs:
  assets:
    name: Asset headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get ROM
        env:
          ROMURL: ${{ secrets.ROMURL }}
        run: |
          if [ -z "$ROMURL" ]; then
            echo "::error::The ROMURL repository secret is not set. Add a private download URL for the US 1.0 ROM under Settings > Secrets and variables > Actions."
            exit 1
          fi
          wget -q --timeout=60 -O baseroms/baserom.us.v77.z64 "$ROMURL"
          echo "$ROM_SHA1  baseroms/baserom.us.v77.z64" | sha1sum -c --quiet -

      - name: Build the asset tool
        run: make -C tools dkr_assets_tool -j4

      - name: Extract and build the assets
        run: |
          ./tools/dkr_assets_tool extract -dkrv us.v77
          ./tools/dkr_assets_tool build -o build/assets.bin -dkrv us.v77

      - name: Upload include/asset_enums.h
        uses: actions/upload-artifact@v4
        with:
          name: asset-enums
          path: include/asset_enums.h
          retention-days: 1

  # Two builds: the debug one (the default; profiler, test runs, bug reports, updates and the performance switches in
  # its menus), which the updater publishes, and the player's build (RELEASE=1), which leaves those out of the menus.
  build-3ds:
    name: 3DS build (${{ matrix.variant }})
    needs: assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debug
            make-flags: ""
            out: port/build/3ds
            artifact: dkr-3ds
          - variant: release
            make-flags: RELEASE=1
            out: port/build/3ds-release
            artifact: dkr-3ds-release
    # devkitARM with libctru and citro3d. To update, pull devkitpro/devkitarm:latest and use its digest.
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The history and tags, for the version (git describe).
          fetch-depth: 0

      - name: Download include/asset_enums.h
        uses: actions/download-artifact@v4
        with:
          name: asset-enums
          path: include

      - name: Build dkr.3dsx
        run: make -C port TARGET=3ds ${{ matrix.make-flags }} -j"$(nproc)"

      # makerom and bannertool are not in devkitPro; fetch pinned releases and check them before use.
      - name: Install makerom and bannertool
        run: |
          command -v unzip >/dev/null || { apt-get update && apt-get install -y unzip; }
          mkdir -p /tmp/cia-tools && cd /tmp/cia-tools
          curl -sSfL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -sSfL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c - <<'SUMS'
          dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970  makerom.zip
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          unzip -o -q makerom.zip && unzip -o -q -j bannertool.zip linux-x86_64/bannertool
          chmod +x makerom bannertool

      - name: Build dkr.cia
        run: make -C port TARGET=3ds ${{ matrix.make-flags }} cia MAKEROM=/tmp/cia-tools/makerom BANNERTOOL=/tmp/cia-tools/bannertool

      - name: Upload dkr.3dsx
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          # dkr.elf has the symbols for reading crash addresses.
          path: |
            ${{ matrix.out }}/dkr.3dsx
            ${{ matrix.out }}/dkr.cia
            ${{ matrix.out }}/dkr.elf

  # Releases (all pre-releases, each holding dkr.3dsx, the installable dkr.cia and build.txt):
  #   3ds-master        the player build (RELEASE=1) of master: the one to download and play
  #   3ds-master-debug  the debug build of master
  #   3ds-newest        the debug build of the latest push to any branch
  # The debug builds' Check for updates button (port/3ds/update_3ds.c) installs 3ds-master-debug or 3ds-newest, so it
  # never swaps a debug build for a player build.
  publish-3ds:
    name: Publish the 3DS build
    # Only once the PC build has played its scenarios without a crash, hang or repeatability failure.
    needs: [build-3ds, host]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time; a newer build waiting replaces an older one.
    concurrency:
      group: port-publish-3ds
    steps:
      - name: Download the debug dkr.3dsx
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-${{ github.sha }}
          path: build/debug

      - name: Download the player dkr.3dsx
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-release-${{ github.sha }}
          path: build/release

      - name: Write build.txt
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          for dir in build/debug build/release; do
            [ -f "$dir/dkr.3dsx" ] || continue
            printf 'commit=%s\nbranch=%s\ndate=%s\nsize=%s\nsha256=%s\n' "$GITHUB_SHA" "$BRANCH" \
              "$(date -u +%Y-%m-%dT%H:%MZ)" "$(stat -c %s "$dir/dkr.3dsx")" \
              "$(sha256sum "$dir/dkr.3dsx" | cut -d' ' -f1)" > "$dir/build.txt"
            # A .cia build updates itself from these (port/3ds/update_3ds.c).
            if [ -f "$dir/dkr.cia" ]; then
              printf 'cia_size=%s\ncia_sha256=%s\n' "$(stat -c %s "$dir/dkr.cia")" \
                "$(sha256sum "$dir/dkr.cia" | cut -d' ' -f1)" >> "$dir/build.txt"
            fi
            cat "$dir/build.txt"
          done

      - name: Publish the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # publish TAG TITLE DIR NOTES
          # An existing release is updated in place (tag moved, files replaced, build.txt last) rather than deleted
          # and made again: a newer push cancels this run, and a cancel between a delete and a create would leave the
          # updaters with no release. A half-updated release is safe: the updater checks the file against build.txt.
          publish() {
            notes="3DS build of $BRANCH at $GITHUB_SHA, made by CI. $4"
            if gh release view "$1" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$1" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
                gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$1" -f sha="$GITHUB_SHA" >/dev/null
              gh release edit "$1" --prerelease --title "$2" --notes "$notes"
              if [ -f "$3/dkr.cia" ]; then
                gh release upload "$1" --clobber "$3/dkr.3dsx" "$3/dkr.cia"
              else
                gh release upload "$1" --clobber "$3/dkr.3dsx"
                gh release delete-asset "$1" dkr.cia --yes 2>/dev/null || true
              fi
              gh release upload "$1" --clobber "$3/build.txt"
            else
              gh release create "$1" --prerelease --target "$GITHUB_SHA" --title "$2" --notes "$notes" \
                "$3/dkr.3dsx" "$3/build.txt" $(ls "$3/dkr.cia" 2>/dev/null)
            fi
          }
          DEBUG_NOTE="Debug build (profiler, test runs, bug reports, updates); install it from the game's Check for updates button."
          publish 3ds-newest "3DS build: newest ($BRANCH, debug)" build/debug "$DEBUG_NOTE"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            publish 3ds-master-debug "3DS build: master (debug)" build/debug "$DEBUG_NOTE"
            publish 3ds-master "3DS build: master" build/release \
              "Copy your own US 1.0 ROM to sdmc:/3ds/dkr/baserom.z64. Then either copy dkr.3dsx to sdmc:/3ds/ and start it from the Homebrew Launcher, or install dkr.cia with FBI to get a HOME menu icon."
          fi

  # A version tag's release: a draft (publish it on GitHub to make it public), marked a pre-release when the version
  # has a label (v0.1.0-beta). Its notes are port/release-notes/<tag>.md when that file exists. Unlike the 3ds-*
  # pre-releases it never moves; pushing the same tag again only replaces a draft, never a published release.
  release-3ds:
    name: Release the 3DS build
    needs: build-3ds
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the player build
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-release-${{ github.sha }}
          path: build/release

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not a version tag (vX.Y.Z or vX.Y.Z-label)."
            exit 1
          fi
          cd build/release
          printf 'version=%s\ncommit=%s\ndate=%s\nsize=%s\nsha256=%s\n' "${TAG#v}" "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%MZ)" "$(stat -c %s dkr.3dsx)" "$(sha256sum dkr.3dsx | cut -d' ' -f1)" > build.txt
          sha256sum dkr.3dsx dkr.cia > SHA256SUMS.txt
          cat build.txt SHA256SUMS.txt
          notes="$GITHUB_WORKSPACE/port/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            notes=$RUNNER_TEMP/notes.md
            {
              echo "Diddy Kong Racing for the New Nintendo 3DS, version ${TAG#v} (commit $GITHUB_SHA)."
              echo
              echo "You need your own US 1.0 ROM: copy it to \`sdmc:/3ds/dkr/baserom.z64\`. Then either copy dkr.3dsx to"
              echo "\`sdmc:/3ds/\` and start it from the Homebrew Launcher, or install dkr.cia with FBI to get a HOME menu icon."
              echo "SHA256SUMS.txt has the files' checksums."
            } > "$notes"
          fi
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$TAG is already published; make a new version tag instead of moving this one."
            exit 1
          fi
          [ "$state" = true ] && gh release delete "$TAG" --yes
          gh release create "$TAG" --draft --verify-tag --title "Diddy Kong Racing 3DS ${TAG#v}" \
            --notes-file "$notes" $(case "$TAG" in *-*) echo --prerelease;; esac) \
            dkr.3dsx dkr.cia SHA256SUMS.txt build.txt

  host:
    name: Host build and frame regression
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib python3-pil

      - name: Download include/asset_enums.h
        uses: actions/download-artifact@v4
        with:
          name: asset-enums
          path: include

      - name: Get ROM
        env:
          ROMURL: ${{ secrets.ROMURL }}
        run: |
          mkdir -p "$RUNNER_TEMP/rom"
          wget -q --timeout=60 -O "$RUNNER_TEMP/rom/baserom.z64" "$ROMURL"
          echo "$ROM_SHA1  $RUNNER_TEMP/rom/baserom.z64" | sha1sum -c --quiet -

      - name: Build the host version
        run: make -C port TARGET=host -j"$(nproc)"

      - name: Upload the host build
        uses: actions/upload-artifact@v4
        with:
          name: dkr-host-${{ github.sha }}
          path: port/build/host/dkr

      - name: Build the previous commit
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The commit this push builds on: the previous tip of the branch, or for a new branch, the parent commit.
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then
            echo "No earlier commit to compare with."
            exit 0
          fi
          echo "Comparing with $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          cp include/asset_enums.h "$RUNNER_TEMP/base/include/"
          if make -C "$RUNNER_TEMP/base/port" TARGET=host -j"$(nproc)"; then
            echo "exe=$RUNNER_TEMP/base/port/build/host/dkr" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The previous commit ($base) doesn't build; frames are not compared."
          fi

      - name: Frame regression
        env:
          BASE_EXE: ${{ steps.base.outputs.exe }}
        run: |
          python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr ${BASE_EXE:+--base "$BASE_EXE"} --out "$RUNNER_TEMP/regression" --max-images 0

      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-regression
          # The report and each run's log only: no frames, since they are pictures of the game and the repository
          # is public. Run port/tools/frame_regression.py locally to see the differing frames.
          path: |
            ${{ runner.temp }}/regression/report.md
            ${{ runner.temp }}/regression/runs/*/*/log.txt
          if-no-files-found: ignore
          retention-days: 7
